<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js + A-Frame: карточка книги над маркером</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- AR.js для A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* Подсказка (необязательно) */
    #hint {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.6); color: #fff; padding: 6px 12px; border-radius: 6px;
      font-family: sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="hint">Наведите камеру на маркер ( Hiro ). Карточка книги появится.</div>

  <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
    <!-- Маркер Hiro: при обнаружении будет показываться карточка -->
    <a-marker preset="hiro" id="bookMarker">
      <!-- Карточка: plane + тексты -->
      <a-entity id="card" visible="false" position="0 0.04 0" rotation="-90 0 0">
        <!-- Фон карточки -->
        <a-plane width="0.9" height="0.5" color="#ffffff" material="opacity:0.95" shadow="cast: false"></a-plane>

        <!-- Текстовые поля карточки -->
        <a-text id="title" value="" color="#000" width="0.8" position="-0.44 0.14 0.01" align="left"></a-text>
        <a-text id="rating" value="" color="#222" width="0.8" position="-0.44 0.04 0.01" align="left"></a-text>
        <a-text id="quote" value="" color="#555" width="0.8" position="-0.44 -0.04 0.01" wrap-count="28" align="left"></a-text>
        <a-text id="year" value="" color="#111" width="0.8" position="-0.44 -0.14 0.01" align="left"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // LOCAL_DATA: локально хранится массив с данными о книгах
    const LOCAL_DATA = [
      {
        title: "1984",
        rating: 4.6,
        quote: "The future belongs to those who dream today.",
        year: 1949,
        author: "George Orwell",
        note: "Dystopian classic"
      },
      {
        title: "To Kill a Mockingbird",
        rating: 4.8,
        quote: "Real courage is when you know you are licked, but you still fight.",
        year: 1960,
        author: "Harper Lee",
        note: "Classic about justice and empathy"
      },
      {
        title: "The Pragmatic Programmer",
        rating: 4.7,
        quote: "The only way to go fast is to go well.",
        year: 1999,
        author: "Andrew Hunt & David Thomas",
        note: "Software engineering wisdom"
      },
      {
        title: "Clean Code",
        rating: 4.5,
        quote: "Leave behind you a little sparkle of laughter.",
        year: 2008,
        author: "Robert C. Martin",
        note: "Guide to clean software craftsmanship"
      }
    ];

    let currentIndex = 0;

    // Элементы карточки
    const marker = document.getElementById('bookMarker');
    const card = document.getElementById('card');
    const titleEl = document.getElementById('title');
    const ratingEl = document.getElementById('rating');
    const quoteEl = document.getElementById('quote');
    const yearEl = document.getElementById('year');

    function updateCard(index) {
      const data = LOCAL_DATA[index % LOCAL_DATA.length];
      titleEl.setAttribute('value', 'Название: ' + data.title);
      ratingEl.setAttribute('value', 'Рейтинг: ' + data.rating);
      quoteEl.setAttribute('value', 'Цитата: "' + data.quote + '"');
      yearEl.setAttribute('value', 'Год выпуска: ' + data.year);
    }

    // Появление/скрытие карточки при обнаружении/потере маркера
    marker.addEventListener('markerFound', () => {
      card.setAttribute('visible', true);
      updateCard(currentIndex);
    });
    marker.addEventListener('markerLost', () => {
      card.setAttribute('visible', false);
    });

    // Переключение на следующую книгу по клику на карточку
    card.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % LOCAL_DATA.length;
      updateCard(currentIndex);
    });

    // Опционально: для десктопа можно включить hover через raycaster
    // Пример: добавьте <a-entity id="pointer" raycaster="objects: .clickable"></a-entity>
    // и назначьте обработчики на маркер/карту для событий pointerenter/pointerleave.
  </script>
</body>
</html>
