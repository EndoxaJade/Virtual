<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Библиотека</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <!-- AR.js + A-Frame -->
<!-- 1. Сначала загрузите A-Frame (обязательно перед AR.js) -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<!-- 2. Затем загрузите AR.js (используйте стабильную версию 3.4.5) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script></head>
<body>
    <!-- AR-сцена -->
    <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
             vr-mode-ui="enabled: false"
             renderer="logarithmicDepthBuffer: true;"
             arjs-hit-testing="enabled: false">
        <!-- Маркер: hiro (для демонстрации; замените на кастомный маркер) -->
        <a-marker preset="hiro" id="main-marker" emitevents="true" 
                  cursor="rayOrigin: mouse" raycaster="objects: .clickable">
            <!-- Здесь можно разместить 3D-объект, но мы используем HTML-оверлей -->
            <a-entity id="marker-anchor"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="./markers/pattern-book1.patt">
            <a-text value="This is book number 1" align="center" color="#ffffff" position="0 0.25 0.02" scale="0.7 0.7 0.7"></a-text>
            </a-marker>

        <a-marker type="pattern" url="./markers/pattern-book2.patt">
            <a-text value="This is book number 2" align="center" color="#ffffff" position="0 0.25 0.02" scale="0.7 0.7 0.7"></a-text>
            </a-marker>

        <a-marker type="pattern" url="./markers/pattern-book3.patt">
            <a-text value="This is book number 3" align="center" color="#ffffff" position="0 0.25 0.02" scale="0.7 0.7 0.7"></a-text>
            </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <!-- HTML-карточка книги (скрыта по умолчанию) -->
    <div id="book-card" class="book-card hidden">
        <div class="card-header">
            <h2 id="card-title">Название книги</h2>
            <button id="close-card">✕</button>
        </div>
        <p id="card-authors" class="authors">Автор</p>
        <p id="card-passport" class="passport">Год | Издательство | Страницы</p>
        <p id="card-isbn" class="isbn">ISBN: —</p>
        <p id="card-rating" class="rating">Рейтинг: —</p>
        <p id="card-genre" class="genre">Жанр: —</p>
        <div class="quote-section">
            <h3>Цитата</h3>
            <p id="card-quote">—</p>
            <p class="source">Источник: citaty.info</p>
        </div>
        <div class="similar-section">
            <h3>Похожие книги</h3>
            <ul id="card-similar"></ul>
        </div>
        <div class="actions">
            <button id="btn-music">🎵 Яндекс Музыка</button>
            <button id="btn-new-quote">🔄 Другая цитата</button>
            <button id="btn-bookmark">🔖 В закладки</button>
            <button id="btn-show-bookmarks">📋 Список закладок</button>
        </div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/books.js"></script>
    <script src="js/quotes.js"></script>
    <script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
</html>
